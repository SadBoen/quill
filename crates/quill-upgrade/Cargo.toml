[package]
name = "quill-upgrade"
version = "0.1.0"
edition = "2021"
description = "手动受控升级（升级前强制备份 + 回滚）"
license = "Apache-2.0"

[dependencies]
quill-adapters = { path = "../quill-adapters" }
quill-domain = { path = "../quill-domain" }

quill-backup = { path = "../quill-backup" }

[dev-dependencies]

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
quill-store = { path = "../quill-store" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
