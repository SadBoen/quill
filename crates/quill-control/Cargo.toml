[package]
name = "quill-control"
version = "0.1.0"
edition = "2021"
description = "多用户控制面（账号 / 鉴权 / 会话管理）"
license = "Apache-2.0"

[dependencies]
quill-adapters = { path = "../quill-adapters" }
quill-domain = { path = "../quill-domain" }
quill-store = { path = "../quill-store" }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
sha2 = "0.10"

getrandom = "0.4.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
