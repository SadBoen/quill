[package]
name = "quill-cli"
version = "0.1.0"
edition = "2021"
description = "quill 命令行入口（doctor / experts / wiki / backup）"
license = "Apache-2.0"

[lib]
name = "quill_cli"
path = "src/lib.rs"

[[bin]]
name = "quill-cli"
path = "src/main.rs"

[dependencies]

quill-adapters = { path = "../quill-adapters" }
quill-domain = { path = "../quill-domain" }
quill-store = { path = "../quill-store" }
quill-control = { path = "../quill-control" }
quill-wiki = { path = "../quill-wiki" }
quill-agent = { path = "../quill-agent" }
quill-backup = { path = "../quill-backup" }
quill-upgrade = { path = "../quill-upgrade" }

quill-server = { path = "../quill-server" }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
sha2 = "0.10"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
