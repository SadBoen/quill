[package]
name = "quill-cli"
version = "0.1.0"
edition = "2021"
description = "quill 命令行入口（doctor / experts / wiki / backup）"
license = "Apache-2.0"
publish = false

[lib]
name = "quill_cli"
path = "src/lib.rs"

[[bin]]
name = "quill-cli"
path = "src/main.rs"

[dependencies]

quill-adapters = { path = "../quill-adapters" }
quill-domain = { path = "../quill-domain" }
quill-store = { path = "../quill-store" }
quill-control = { path = "../quill-control" }
quill-wiki = { path = "../quill-wiki" }
quill-agent = { path = "../quill-agent" }
quill-backup = { path = "../quill-backup" }
# 说明：`quill-upgrade` 的依赖已删（queue Q091 抽查发现它零调用）。
# 升级前备份守卫现在由 `quill-server` 的 `/api/upgrade/prepare` 真调用（Q039），
# CLI 这边一次都没用过 —— 「声明了没人用」正是 Cargo.toml 里记的那类空壳。

quill-server = { path = "../quill-server" }
# `quill mcp memory` 直接调内核的记忆服务器（`quill_core::memory::serve_stdio`）。
# 内核是 L3、CLI 是 L5，依赖向下，层次守卫认可。
quill-core = { path = "../quill-core" }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
sha2 = "0.10"

[dev-dependencies]
# `tests/mcp_memory_stdio.rs` 手写 JSON-RPC 跟 `quill mcp memory` 这个子进程对话，
# 用它拼请求、解响应（与 `quill-server/src/bin/mcp_stub.rs` 一个路数）。
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
