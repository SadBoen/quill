[package]
name = "quill-backup"
version = "0.1.0"
edition = "2021"
description = "备份与恢复（WAL 安全一致性）"
license = "Apache-2.0"
publish = false

[dependencies]

quill-adapters = { path = "../quill-adapters" }
quill-domain = { path = "../quill-domain" }

quill-store = { path = "../quill-store" }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
sha2 = "0.10"

[dev-dependencies]

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
