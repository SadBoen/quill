[package]
name = "quill-store"
version = "0.1.0"
edition = "2021"
description = "Quill 状态存储 —— SQLite 连接层与 schema 约束的运行时守卫"
license = "Apache-2.0"
publish = false

[dependencies]

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
sha2 = "0.10"

[dev-dependencies]

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
