[package]
name = "quill-core"
version = "0.1.0"
edition = "2021"
description = "Agent 内核层（照 vendor/goose 移植）：MCP 客户端 / 工具执行 / provider 组装 / 对话循环"
license = "Apache-2.0"
publish = false

[dependencies]

# rmcp 是 MCP 协议客户端，`vendor/goose` 的 `mcp_client.rs` 用的是同一族 API
# （goose 也用 rmcp），移植时按 goose 的调用序列照抄，见 `src/mcp_client.rs` 头注。
# `default-features = false`：默认那组带 server / macros / base64，客户端用不上。
rmcp = { version = "3.5.1", default-features = false, features = [
    "client",
    "transport-child-process",
] }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
] }
serde_json = "1"
