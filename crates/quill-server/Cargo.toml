[package]
name = "quill-server"
version = "0.1.0"
edition = "2021"
description = "Quill 服务端二进制入口（组装全部 crate）"
license = "Apache-2.0"

[lib]
name = "quill_server"
path = "src/lib.rs"

[[bin]]
name = "quill-server"
path = "src/main.rs"

[dependencies]

quill-adapters = { path = "../quill-adapters" }
quill-domain = { path = "../quill-domain" }
quill-store = { path = "../quill-store" }
quill-control = { path = "../quill-control" }
quill-agent = { path = "../quill-agent" }
quill-wiki = { path = "../quill-wiki" }
quill-provider = { path = "../quill-provider" }

axum = { version = "0.8", features = ["http1", "json", "tokio"] }

getrandom = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "charset",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }

tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
serde_json = "1"

[dev-dependencies]

http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
