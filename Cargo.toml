[workspace]
resolver = "2"
members = [

    "crates/quill-adapters",
    "crates/quill-domain",
    "crates/quill-store",
    "crates/quill-bridge",
    "crates/quill-control",
    "crates/quill-wiki",
    "crates/quill-agent",
    "crates/quill-ext-hub",
    "crates/quill-backup",
    "crates/quill-provider",
    "crates/quill-upgrade",
    "crates/quill-xtask",

    "crates/quill-testkit",

    "crates/quill-server",
    "crates/quill-cli",
]

exclude = [
    "crates/quill-testkit/fixtures/*",
    "crates/quill-testkit/fixtures/**",
]
