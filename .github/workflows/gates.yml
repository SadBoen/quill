# CI：每次 push 与 PR 都跑一遍门禁。
#
# **为什么要有它**：这个项目的门禁（`.scripts/gates.sh`）此前只靠人记得手动跑。
# 后果是「门禁全绿」这句话没有任何强制力 —— 它只证明**有人跑过**，
# 不证明**现在还是绿的**。别的 clone 下来的人更是完全无从验证。
#
# **这个工作流刻意分成两个 job**，因为这些门禁对环境的依赖根本不同：
#
#   · gates-core —— fresh clone 上就能跑的那些：Rust 构建与全部测试、
#     前端 typecheck / lint / vitest / build、乱码、i18n、以及门禁自测。
#     不需要任何 secret，任何人（包括 fork 的 PR）都能跑。
#   · gates-upstream —— 需要**私有**上游参考源码（.octop-ref/octop）的那三道：
#     专家库源 vs 产物双向比对、UPSTREAM.md 的 pin 核对、以及
#     UPSTREAM-USAGE.md 里每条上游引用的逐行核验。
#     octop 不在公开仓库里（见 .scripts/fetch-vendor.sh 的说明），
#     所以这个 job 只在仓库 secrets 里配了 OCTOP_REPO 时才跑；
#     没配就**如实跳过并说明**，绝不假装通过。
#
# 那三道门禁在缺上游时会让 gates.sh 以退出码 1 结束并写明「不算全绿」——
# 这是刻意的：本地开发者有那份检出，跑不满就该看见。CI 里则拆成独立 job，
# 因为 GitHub 无法给 fork 的 PR 注入 secret。
#
# 另注：`gates-core` 里没有跑 `.upstream-check.mjs --online`（那要联网查上游
# 是不是已经前进）。它是有意保留给本地按需执行的，理由同上：它核的是
# 「上游有没有比我们记录的更新」，属于需要判断的时刻，不属于每次必跑的卫生检查。

name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 直接取消上一轮：CI 最怕的是排队十几轮跑同一件事。
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates-core:
    name: 门禁（可公开跑的部分）
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 按仓库根的 `rust-toolchain.toml` 装工具链，并带上 rustfmt 与 clippy：
      # 最高指示第 5 条把 `cargo fmt --check` 与 `cargo clippy -D warnings` 列为门禁的一部分。
      # 用 `@master` 且**不**给 `toolchain` 输入，是为了让它读仓库里的 rust-toolchain.toml ——
      # 否则会出现「本地钉 1.99.0、CI 跑浮动 stable」两边版本漂，门禁的绿就不是同一个绿的。
      # 先自己把版本从 rust-toolchain.toml 里读出来，再喂给 action（queue Q107）。
      # 原来只给 components 不给 toolchain，指望 action 自己去读仓库里的文件 ——
      # 实测那一步在 runner 上 ~30 毫秒内失败、日志里只有 ##[error]Process completed
      # with exit code 1.，其后的 20 多个步骤全部被跳过：也就是说**所有门禁在 CI 上
      # 从未真正跑过**。版本仍只有 rust-toolchain.toml 一处来源（不在这里写第二遍）。
      - name: 读出 rust-toolchain.toml 里固定的版本
        id: tc
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          test -n "$channel" || { echo "rust-toolchain.toml 里读不到 channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "固定版本：$channel"

      - name: 装 Rust（按 rust-toolchain.toml 读出的版本，含 rustfmt + clippy）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          components: rustfmt, clippy
        with:
          components: rustfmt, clippy

      # 缓存 cargo 产物与 npm 的下载缓存（**不是** node_modules）：
      # 下面跑的是 `npm ci`，它会先删掉 node_modules 再按 lock 重装 ——
      # 所以缓存 node_modules 毫无意义，只是白白占磁盘。npm 的下载缓存
      # （~/.npm）才是 `npm ci` 真正能复用的部分，由 setup-node 的
      # cache: npm 按 package-lock.json 的哈希来管理。
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}-${{ runner.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/web/package-lock.json

      # `npm ci` 而不是 `npm install`：前者严格按 package-lock.json 装，
      # lock 与 package.json 对不上时**直接失败**。这条纪律值得保住 ——
      # 一旦放了 `|| npm install`，lock 就只是个摆设了，CI 与本地
      # 装的会是两棵不同的依赖树，而门禁的绿是其中一棵的绿。
      # 注意本项目本地有个坑：node_modules 在 WSL 与 Windows 之间共用，
      # 跑完一侧另一侧会报 native binding 缺失。在 CI 里没有这个问题，
      # 因为每个 job 都是全新的一次安装。
      - name: 装前端依赖
        working-directory: ui/web
        run: npm ci --no-audit --no-fund

      # 下面逐步跑，而不是直接调 gates.sh：那个脚本在本机（有无上游检出、
      # 有无 node）会按环境调整步骤，在 CI 里跑反而会得到一个含义模糊的
      # 退出码。这里把每一步都显式写出来，失败时 GitHub 界面直接指出是哪一道。
      - name: 门禁自测
        run: bash .scripts/gate-selftest.sh

      - name: 构建
        run: cargo build --workspace

      - name: Rust 全部测试
        run: cargo test --workspace

      # 最高指示第 5 条把这两道列为门禁的一部分。此前 CI 刻意没跑它们
      # （旧注释原话「刻意不开 clippy/rustfmt」），于是一整类问题只能靠人记得手动看。
      - name: Rust 格式检查（rustfmt）
        run: cargo fmt --all -- --check

      - name: Rust lint（clippy，warning 即失败）
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 最高指示第 4 条：最终产物只打包 quill。goose / octop 只能抄、不能依赖。
      - name: 文本门禁 · 不许把 goose / octop 当依赖
        run: node .vendor-freedom-check.mjs

      - name: 该判定的自测
        run: node .vendor-freedom-check.mjs --self-test

      # 分层守卫（docs/ARCHITECTURE.md §3.1「依赖只能向下」）：
      # 回答「有没有 crate 的 [dependencies] 反向依赖了上层——或同层的——quill-* crate」。
      # 编译/测试全绿也照样可能层次倒挂（Cargo.toml 里加一行的事），只有依赖图能看见它。
      # 已知的既成事实违例（quill-upgrade -> quill-backup 同层）走脚本里的显式基线豁免：
      # 出现**不在基线里**的新违例 = 报红；基线条目**已修复却还留着**（陈旧）= 也报红，
      # 逼着清单只减不增。dev-dependencies 放宽但会在输出里逐条列出。
      - name: 文本门禁 · 分层守卫（依赖只能向下）
        run: node .layer-guard.mjs

      - name: 分层守卫判定的自测
        run: node .layer-guard.mjs --self-test

      # 公开 API 兼容门禁（Q010）：回答「这次改动有没有把 quill-adapters 的公开 API
      # 删掉/改坏」。基线是 docs/api-baseline/quill-adapters.txt —— **已发布契约的
      # 近似，不是类型级真值**；删除条目 / 签名变化 → 红，新增 → 允许。
      # CI 里只跑检查，绝不跑 --update（接受契约变更必须在 review 里显式发生）。
      # 本仓库 crate 都是 publish = false，cargo-semver-checks 的 check-release
      # 没有可比的已发布版本（实测直接报 not found in registry），故用本脚本；
      # 局限与升级路径（semver-checks 的 --baseline-rev 可用）见脚本头注释。
      - name: 文本门禁 · 公开 API 兼容（quill-adapters）
        run: node .api-compat-check.mjs

      - name: 公开 API 兼容判定的自测
        run: node .api-compat-check.mjs --self-test

      - name: 文本门禁 · 乱码
        run: node .mojibake-check.mjs

      - name: 文本门禁 · i18n
        run: node .i18n-check.mjs

      # 门禁自身的退出码（queue Q106）。2026-10-08 真抓到一个：`.i18n-check.mjs`
      # 里一个 `process.exit` 都没有，问题逐条打印得很清楚却照样退 0 ——
      # 于是「漏翻译会报红」是空头承诺，流水线永远是绿的。
      # 这道自检扫全部门禁脚本，谁没有非 0 退出路径就红。
      - name: 门禁退出码自检
        run: node .scripts/gate-exit-selftest.mjs

      - name: 该判定的自测
        run: node .scripts/gate-exit-selftest.mjs --self-test

      # 移植基准：index.css 必须与 vendor/openoctopus-frontend 逐字节一致。
      # 钉的是移植那一刻的哈希，所以**不需要 vendor 在手边** —— 这正是它能进
      # gates-core（不需要任何 secret 的那个 job）的原因。以前这道检查只躺在
      # 一次性脚本里，谁都没跑。
      - name: 文本门禁 · 移植基准
        run: node .vendor-baseline-check.mjs

      - name: 移植基准判定的自测
        run: node .vendor-baseline-check.mjs --self-test

      # 禁止把 vendor/openoctopus-frontend（Zpoteiti/OpenOctopus，另一个项目）
      # 当成 Octop 引用 —— 2026-10-08 照它写过几百行，而它里面没有微信通道。
      # 真 Octop 是 .octop-ref/octop。
      - name: 文本门禁 · 别把另一个项目当 Octop
        run: node .octop-baseline-check.mjs

      - name: 该判定的自测
        run: node .octop-baseline-check.mjs --self-test

      - name: 文本门禁 · 上游判定的自测
        run: node .scripts/upstream-check-selftest.mjs

      - name: 文本门禁 · 出处判定的自测
        run: node .scripts/provenance-selftest.mjs

      # 项目状态计算器的自测。**必须进 CI**：status.mjs 算出的是一张
      # 「哪些待办真的完成了」的表，而 2026-10-08 它自己的用例名拼接是坏的，
      # 三条真绿的判据被报成「判据本身坏了」。本地自测当时 21 项全绿也没发现 ——
      # 因为自测里那个用例名是手写的合成数据，从没经过真正拼名字的代码。
      # 这条不进 CI，就等于把「状态表可信」寄托在某个人的机器上。
      - name: 状态计算器自测
        run: node scripts/status-selftest.mjs

      - name: 前端 typecheck
        working-directory: ui/web
        run: npm run typecheck

      - name: 前端 lint
        working-directory: ui/web
        run: npm run lint

      - name: 前端测试
        working-directory: ui/web
        run: npx vitest run

      - name: 前端 build
        working-directory: ui/web
        run: npm run build

  gates-upstream:
    name: 门禁（需要私有上游的那部分）
    # 没配 OCTOP_REPO 就整条跳过，并在界面上显示为 skipped —— 不是通过。
    #
    # **这里只能用 `vars`，不能用 `secrets`**（这个坑让整个 CI 白挂了五天）：
    # job 级的 `if:` 里 secrets 上下文不可用，写了它 GitHub 会**解析整个工作流失败**
    # —— 2026-10-08 实测连着 5 次 push 全部 0 秒、0 个 job，连 gates-core 都跑不了。
    # GitHub 当时的原话：
    #   Invalid workflow file: .github/workflows/gates.yml#L1 (Line: 139, Col: 9):
    #   Unrecognized named-value: 'secrets'.
    #
    # 而 OCTOP_REPO 只是个 clone 地址、不是凭据，本来就该配成仓库变量
    # （Settings → Secrets and variables → Actions → Variables）而不是 secret。
    if: ${{ github.event_name != 'pull_request' && vars.OCTOP_REPO != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 变量优先、secret 兜底：两边配任意一边都能跑。
    # 变量没配时是 null，比较时按空串处理，所以 `!= ''` 为假 —— 整条跳过，如实显示 skipped。
    env:
      OCTOP_REPO: ${{ secrets.OCTOP_REPO || vars.OCTOP_REPO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 取回上游参考源码
        run: bash .scripts/fetch-vendor.sh

      - name: 专家库源 vs 产物
        run: node .library-check.mjs

      - name: 上游基线核对
        run: node .upstream-check.mjs

      - name: 每条上游引用逐行核验
        run: node .provenance-check.mjs
