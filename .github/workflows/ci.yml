name: CI

# =============================================================================
# Quill CI —— 铁律六 / 八 / 二十的**真实执行者**
#
# 🔴 设计前提（来自实测，不是假设）：
#   1. 本 CI **只做校验，不产出发布制品**。
#      铁律一：glibc 不向前兼容。GitHub runner 的 glibc 高于目标 NAS 的 2.36，
#      在 runner 上 `cargo build --release` 出的东西同样不能当制品。
#      将来若要出制品，**必须**另起 `container: debian:12` 的 job。
#   2. 任何失败一律暴露。本文件不含「忽略失败」类构造：
#      没有 shell 的失败兜底、没有「允许失败」开关、没有 always 条件。
#      跑不了的项目用**显式标注**说明，绝不静默跳过。
#   3. 每条命令都在本地实测跑通过才写进来；未跑通的（见下方「显式排除」）
#      一律不写。
# =============================================================================

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需要读代码。
permissions:
  contents: read

# 同一 PR 的新 push 取消旧 run（避免过期结果冒充最新结论）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 闸门自检在解析跨平台路径时依赖 python3；缺它必须硬失败（run-gate-selftest 自身会 exit 2）
  PYTHON: python3

jobs:
  # ===========================================================================
  # 第一组 · Rust —— 静态检查
  # ===========================================================================
  lint:
    name: Rust · fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（runs.using=node24）
        with:
          persist-credentials: false

      - name: Install toolchain (stable, 带 rustfmt/clippy)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # ⚠️ 缓存只加速「编译产物」，**不缓存任何测试结论**。
      #    cargo fmt / clippy / test 每次都会重新执行并重新判定，
      #    因此不可能出现「因为命中缓存所以绿灯」的情况。
      - name: Cache build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2（runs.using=node24）
        with:
          shared-key: lint
          cache-on-failure: false

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      # --locked：禁止 cargo 悄悄改写 Cargo.lock 后继续编译。
      #   实测（cargo metadata --locked，工作树与干净 clone 均 rc=0，
      #   且 Cargo.lock 未被改动）证明当前 lock 与 manifest 一致，可安全启用。
      - name: cargo clippy --workspace --all-targets --locked -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # ===========================================================================
  # 第一组 · Rust —— 测试（debug + release）
  # ===========================================================================
  test:
    name: Rust · test (debug + release)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（runs.using=node24）
        with:
          persist-credentials: false

      - name: Install toolchain (stable)
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2（runs.using=node24）
        with:
          shared-key: test
          cache-on-failure: false

      # release 必须单独跑：debug 的断言会掩盖只在 release 暴露的 bug。
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      - name: cargo test --workspace --release --locked
        run: cargo test --workspace --release --locked

  # ===========================================================================
  # 第二组 · 闸门自检 —— 本项目的核心资产
  # ===========================================================================
  gates:
    name: 闸门自检
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（runs.using=node24）
        with:
          persist-credentials: false

      # ----------------------------------------------------------------------------
      # 覆盖公告 —— 放在最前面，确保任何人翻日志第一眼就看到「本 job 覆盖了什么」
      # ----------------------------------------------------------------------------
      # ⚠️ 2026-10-05 订正：本节原为「3 项闸门自检未在 CI 执行」，理由是脚本硬编码
      #    `/mnt/d/...` 本机路径。**该理由已失效** —— 实测（从仓库外 cwd 调用）：
      #      · scripts/ 下 /mnt/d/ 仅剩 2 处**注释**，无一处可执行代码
      #      · 三个自检都已有显式 exit，rc=0（26/26、8/8、6/6 全通过）
      #    过期公告比没有公告更糟：它让人以为这三道闸门没人在管。现已全部纳入下方步骤。
      - name: 覆盖公告（本 job 的实际覆盖范围）
        run: |
          {
            echo "## ✅ 闸门自检覆盖公告（2026-10-05 实测更新）"
            echo
            echo "| 自检脚本 | 对应闸门 | CI 状态 |"
            echo "|---|---|---|"
            echo "| \`scripts/test-check-boundary-singletons.sh\` | G26 | ✅ 已纳入 |"
            echo "| \`scripts/test-check-crate-classification.sh\` | G27 | ✅ 已纳入 |"
            echo "| \`scripts/test-check-spa-fallback.sh\` | G30 | ✅ 已纳入（服务不可达时判 rc=2，不判绿） |"
            echo "| \`scripts/test-check-doc-refs.sh\` | G39 | ✅ 已纳入 |"
            echo "| \`scripts/test-check-crate-deps.sh\` | G40 | ✅ 已纳入 |"
            echo "| \`scripts/test-newtype-guard.sh\` | G41 | ✅ 已纳入（newtype 编译期隔离） |"
            echo "| \`scripts/test-check-workspace-hygiene.sh\` | G38 | ✅ 已纳入 |"
            echo "| \`scripts/test-quill-doctor-roaming.sh\` | G37 | ✅ 已纳入 |"
            echo "| \`scripts/test-check-no-external-refs.sh\` | G29 | ✅ 已纳入 |"
            echo
            echo "**判定口径**：本 job 对每支自检都做 **rc + SELFTEST_FAIL 双重判定** ——"
            echo "只看 rc 已被实测证明会把「0 通过 / 6 失败」判成通过。"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 文档引用真实性：authoritative 档必须 0 假引用（2026-10-05 新增）----
      - name: G39 · 文档引用全量扫描（含 docs 三档分流）
        run: |
          out="$(bash scripts/check-doc-refs.sh --docs 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "❌ check-doc-refs --docs 退出码 $rc（authoritative 档存在假引用）"
            exit 1
          fi
          echo "✓ G39 全 docs 扫描通过（authoritative 档 0 处假引用）"

      - name: G39 · 自检（分档 / CIDR / 豁免 双向用例）
        run: |
          out="$(bash scripts/test-check-doc-refs.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then echo "❌ 退出码 $rc"; exit 1; fi
          echo "✓ G39 自检通过"

      - name: G40 · crate 依赖方向自检
        run: |
          out="$(bash scripts/test-check-crate-deps.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then echo "❌ 退出码 $rc"; exit 1; fi
          echo "✓ G40 自检通过"

      - name: G26 · 边界单例自检
        run: |
          out="$(bash scripts/test-check-boundary-singletons.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then echo "❌ 退出码 $rc"; exit 1; fi
          if printf '%s' "$out" | grep -q 'SELFTEST_FAIL'; then
            echo "❌ 输出含 SELFTEST_FAIL"; exit 1
          fi
          echo "✓ G26 自检通过"

      - name: G27 · crate 分类自检
        run: |
          out="$(bash scripts/test-check-crate-classification.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then echo "❌ 退出码 $rc"; exit 1; fi
          if printf '%s' "$out" | grep -q 'SELFTEST_FAIL'; then
            echo "❌ 输出含 SELFTEST_FAIL"; exit 1
          fi
          echo "✓ G27 自检通过"

      - name: G30 · SPA 回退自检（服务不可达时必须判 rc=2）
        run: |
          out="$(bash scripts/test-check-spa-fallback.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then echo "❌ 退出码 $rc"; exit 1; fi
          if printf '%s' "$out" | grep -q 'SELFTEST_FAIL'; then
            echo "❌ 输出含 SELFTEST_FAIL"; exit 1
          fi
          echo "✓ G30 自检通过"

      - name: G38 · 工作区卫生自检
        run: |
          out="$(bash scripts/test-check-workspace-hygiene.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then echo "❌ 退出码 $rc"; exit 1; fi
          echo "✓ G38 自检通过"

      # G41 需要先编出 quill-adapters 的 rlib，故必须放在 test job 之后有 target 缓存的上下文；
      # 脚本自身会 `cargo build -p quill-adapters`，无需额外步骤。
      - name: G41 · newtype 编译期隔离自检
        run: |
          out="$(bash scripts/test-newtype-guard.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then echo "❌ 退出码 $rc"; exit 1; fi
          echo "✓ G41 自检通过"
      # ----------------------------------------------------------------------------
      # 反向模式：可移植且**能判红**。它直接调 \`\${ROOT}/\${script}\`，不经过 self_test。
      # ----------------------------------------------------------------------------
      - name: run-gate-selftest --falsify（证明每道闸门能判红）
        run: bash scripts/run-gate-selftest.sh --falsify

      # ----------------------------------------------------------------------------
      # 正常模式：rc 与输出双重判定。
      # 为什么不能只看 rc：实测证明它会把「0 通过 / 6 失败」判成通过（见报告）。
      # ----------------------------------------------------------------------------
      - name: run-gate-selftest（rc + SELFTEST_FAIL 双重判定）
        run: |
          out="$(bash scripts/run-gate-selftest.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "❌ run-gate-selftest 退出码 $rc（非 0）"
            exit 1
          fi
          if printf '%s' "$out" | grep -q 'SELFTEST_FAIL'; then
            echo "❌ run-gate-selftest 输出含 SELFTEST_FAIL —— 有 self_test 报告失败却被退出码掩盖"
            exit 1
          fi
          echo "✓ run-gate-selftest 通过（rc=0 且无 SELFTEST_FAIL）"

      # ---- 逐个自检：rc + SELFTEST_FAIL 双重判定（补 runner 的判红盲区）----

      - name: G37 · quill-doctor-roaming 自检
        run: |
          out="$(bash scripts/test-quill-doctor-roaming.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then echo "❌ 退出码 $rc"; exit 1; fi
          echo "✓ G37 自检通过"

      - name: G29 · 产物自包含自检
        run: |
          out="$(bash scripts/test-check-no-external-refs.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then echo "❌ 退出码 $rc"; exit 1; fi
          if printf '%s' "$out" | grep -q 'SELFTEST_FAIL'; then
            echo "❌ 输出含 SELFTEST_FAIL（该脚本失败时仍退出 0，必须查输出）"; exit 1
          fi
          echo "✓ G29 自检通过"

      # ---- schema 验证（2026-10-05 新增）--------------------------------
      # 🔴 为什么必须接进来：这套验证物**曾经不在任何闸门或 CI 里**，
      #    于是 2026-10-05 删掉 users.password_algo 的默认值后，
      #    三份脚本同时腐烂（rc=1），而 CI 全绿 —— 典型的
      #    「靠人记得的规则」失效：没人记得它，就没人跑它。
      #    判据取**返回值**（run.sh 非 0 即失败），不看输出措辞。
      - name: schema 验证（44 条语句 / 57 条断言）
        run: |
          out="$(bash crates/quill-store/verify/run.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then
            echo "❌ schema 验证退出码 $rc"
            exit 1
          fi
          # 双重判定：rc=0 也要确认真的跑出了断言，避免「0 条断言也判绿」
          n=$(printf '%s' "$out" | grep -cE '^\[PASS\]' || true)
          echo "✓ schema 验证通过（PASS 断言 $n 条）"
          if [ "$n" -lt 40 ]; then
            echo "❌ PASS 断言只有 $n 条（预期 ≥40）—— 疑似提取器失效或断言被删"
            exit 1
          fi

      - name: manifest 契约校验
        run: python3 scripts/validate-gates-manifest.py scripts/gates.manifest.json

      # ----------------------------------------------------------------------------
      # 可移植性体检（**不判定通过/失败**，只把事实摆到日志与 summary 里）
      #
      # 🔴 2026-10-05 修正一处**误报**：本节原用 `grep -rn '^GATE='`，
      #    它把三类**完全正常**的写法一并报出，导致首次 run 就挂了一条假警告：
      #      1. `GATE="$ROOT/scripts/x.sh"`   —— 由 BASH_SOURCE 推算（正是修好的写法）
      #      2. `GATE="$HERE/x.sh"` / `$SCRIPT_DIR/…` —— 同上
      #      3. `GATE='G39'`                  —— 那是**闸门名**，不是路径
      #    真正要抓的是**字面绝对路径**：`GATE=/mnt/d/...`、`GATE="/home/…"`。
      #    故改为 `GATE=` 后紧跟 `/` 的形式：变量展开（`$`）与闸门名（字母）都不匹配。
      #    零漏报论证：任何真硬编码路径必然以 `/` 开头，故不会被漏掉。
      # ----------------------------------------------------------------------------
      - name: 可移植性体检（仅供参考，不参与判定）
        run: |
          hard=$(grep -rnE "^[[:space:]]*GATE=['\"]?/" scripts/ || true)
          if [ -n "$hard" ]; then
            echo "::warning::发现硬编码 GATE= 绝对路径（会让闸门在 CI 上不可达）"
          else
            echo "::notice::未发现硬编码 GATE= 绝对路径"
          fi
          # 附带把「有 GATE 赋值但不是绝对路径」的数量摆出来，
          # 免得「0 条」与「根本没检查」在屏幕上无法区分。
          assigned=$(grep -rcE "^[[:space:]]*GATE=" scripts/ 2>/dev/null | awk -F: '{s+=$2} END {print s+0}')
          {
            echo
            echo "### 闸门脚本可移植性体检"
            echo
            echo "- 已检查的 GATE 赋值行：**$assigned** 行"
            echo "- 其中字面绝对路径：**$(printf '%s' "$hard" | grep -c . || true)** 行"
            echo
            echo '```'
            if [ -n "$hard" ]; then printf '%s\n' "$hard"; else echo "（未发现硬编码 GATE= 绝对路径）"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$hard" ]; then printf '%s\n' "$hard"; else echo "（未发现硬编码 GATE=）"; fi

  # ===========================================================================
  # 第三组 · 铁律九 —— vendor/goose 零 diff
  # ===========================================================================
  vendor:
    name: 铁律九 · vendor 零 diff
    runs-on: ubuntu-24.04
    steps:
      # ⚠️ 这里用 fetch-depth: 0：要比较「本次提交相对基线改了哪些文件」，
      #    浅克隆拿不到基线提交，拿不到就只能跳过检查 —— 那正是恒绿闸门。
      #    不做「checkout 干净工作树上跑 git diff」是因为那里恒等于绿。
      - name: Checkout（全历史，用于计算提交差异）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（runs.using=node24）
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 本次提交是否触碰 vendor/goose（pinned 区禁改）
        run: |
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::本次事件无可用基线提交（workflow_dispatch 或首次 push）—— **vendor 增量检查未执行**"
            echo "⚠️ 未执行：无基线可比。这不是「通过」。"
            { echo; echo "⚠️ **vendor 增量检查本次未执行**（无基线提交：workflow_dispatch 或仓库首次 push）。这不是通过。"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "基线 BASE=$BASE"
          echo "本次 HEAD=$GITHUB_SHA"
          CHANGED="$(git diff --name-only "$BASE" "$GITHUB_SHA" -- vendor/goose/)"
          if [ -n "$CHANGED" ]; then
            echo "❌ 铁律九被违反：本次提交改动了 pinned 区 vendor/goose/"
            printf '%s\n' "$CHANGED"
            { echo; echo "❌ **铁律九被违反**：本次提交改动了 \`vendor/goose/\`"; echo '```'; printf '%s\n' "$CHANGED"; echo '```';
              echo "同步 goose 必须走独立 sync PR（永不自动合并），本地改动须登记 \`QUILT-PATCHES.md\`。"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✓ 本次提交未触碰 vendor/goose/"

      - name: .upstream-pin 格式校验
        run: |
          PIN_FILE=".upstream-pin"
          if [ ! -f "$PIN_FILE" ]; then
            echo "❌ 缺少 $PIN_FILE —— 铁律九要求 pinned 区必须有可追溯的上游锚点"
            exit 1
          fi
          TAG="$(awk 'NR==1{print $1}' "$PIN_FILE")"
          SHA="$(awk 'NR==1{print $2}' "$PIN_FILE")"
          echo "上游 tag=$TAG  commit=$SHA"
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "❌ .upstream-pin 的 commit 不是 40 位十六进制：$SHA"; exit 1; }
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "❌ .upstream-pin 的 tag 格式不是 vX.Y.Z：$TAG"; exit 1; }
          echo "✓ .upstream-pin 格式合规"

      # ⚠️ 这一步需要访问 github.com（上游仓库 aaif-goose/goose）。
      #    实测：用 --depth 1 --filter=blob:none 只拉 224K，
      #    不存在的 sha 会被上游明确拒绝（upload-pack: not our ref → rc=128）。
      - name: .upstream-pin 指向的提交在上游真实存在
        run: |
          set -euo pipefail
          SHA="$(awk 'NR==1{print $2}' .upstream-pin)"
          PROBE="$(mktemp -d)"
          cd "$PROBE"
          git init -q .
          git remote add origin https://github.com/aaif-goose/goose.git
          git -c protocol.version=2 fetch --quiet --depth 1 --filter=blob:none origin "$SHA"
          git cat-file -e "${SHA}^{commit}"
          echo "✓ 上游存在该提交：$SHA"
